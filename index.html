<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Executor Environment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #16161c;
            --bg-tertiary: #1e1e26;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #272730;
            --status-green: #10b981;
            --status-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Main Window Container */
        .window {
            width: 1000px;
            height: 650px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 20px rgba(99, 102, 241, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .titlebar {
            height: 40px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .titlebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .titlebar-brand i {
            color: var(--accent-color);
            font-size: 16px;
        }

        .titlebar-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-red);
            box-shadow: 0 0 8px var(--status-red);
            transition: all 0.3s ease;
        }

        .status-dot.attached {
            background-color: var(--status-green);
            box-shadow: 0 0 8px var(--status-green);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar: Saved Scripts */
        .sidebar {
            width: 220px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .sidebar-header i:hover {
            color: var(--accent-color);
        }

        .script-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .script-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .script-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-main);
        }

        .script-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-color);
            font-weight: 500;
        }

        .script-item .delete-btn {
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .script-item:hover .delete-btn {
            opacity: 1;
        }

        .script-item .delete-btn:hover {
            color: var(--status-red);
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }

        /* Tabs Bar */
        .tabs-bar {
            height: 38px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .tab .close-tab {
            font-size: 10px;
            border-radius: 50%;
            padding: 2px;
        }

        .tab .close-tab:hover {
            color: var(--status-red);
        }

        .add-tab-btn {
            padding: 6px 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            transition: color 0.2s;
        }

        .add-tab-btn:hover {
            color: var(--text-main);
        }

        /* Code Monaco Canvas */
        #monaco-editor-container {
            flex: 1;
            width: 100%;
        }

        /* Console Output Drawer */
        .console-drawer {
            height: 110px;
            background: #09090b;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }

        .console-header {
            padding: 4px 12px;
            background: var(--bg-primary);
            color: var(--text-muted);
            font-size: 11px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .console-logs {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            color: #a1a1aa;
        }

        .log-entry.info { color: #38bdf8; }
        .log-entry.success { color: var(--status-green); }
        .log-entry.warn { color: #fbbf24; }
        .log-entry.error { color: var(--status-red); }

        /* Action Controls Toolbar */
        .toolbar {
            height: 52px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background: #272732;
        }
    </style>
</head>
<body>

    <div class="window">
        <!-- Title bar -->
        <div class="titlebar">
            <div class="titlebar-brand">
                <i class="fa-solid fa-code"></i>
                <span>Apex Luau Environment</span>
            </div>
            <div class="titlebar-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <!-- Main Body -->
        <div class="workspace">
            <!-- Saved Scripts Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>Script Hub</span>
                    <i class="fa-solid fa-bookmark" title="Saved items"></i>
                </div>
                <div class="script-list" id="scriptList">
                    <!-- Dynamic script list -->
                </div>
            </div>

            <!-- Editor Section -->
            <div class="editor-container">
                <!-- Tab Controls -->
                <div class="tabs-bar" id="tabsBar">
                    <div class="tab active" data-tab="1">
                        <span>Script 1.luau</span>
                        <i class="fa-solid fa-xmark close-tab"></i>
                    </div>
                    <div class="add-tab-btn" id="addTabBtn">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>

                <!-- Monaco Editor Canvas -->
                <div id="monaco-editor-container"></div>

                <!-- Console Drawer -->
                <div class="console-drawer">
                    <div class="console-header">
                        <span>CONSOLE OUTPUT</span>
                        <span id="clearConsole" style="cursor: pointer;"><i class="fa-solid fa-trash"></i> Clear</span>
                    </div>
                    <div class="console-logs" id="consoleLogs">
                        <div class="log-entry info">[System] Environment initialized. Ready.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn btn-primary" id="btnExecute">
                    <i class="fa-solid fa-play"></i> Execute
                </button>
                <button class="btn btn-secondary" id="btnClear">
                    <i class="fa-solid fa-eraser"></i> Clear
                </button>
                <button class="btn btn-secondary" id="btnSave">
                    <i class="fa-solid fa-floppy-disk"></i> Save Script
                </button>
            </div>
            <div class="toolbar-group">
                <button class="btn btn-secondary" id="btnAttach">
                    <i class="fa-solid fa-plug"></i> Attach
                </button>
            </div>
        </div>
    </div>

    <script>
        let editor = null;
        let isAttached = false;
        let tabCount = 1;

        // Default code snippet
        const initialLuauCode = `-- Sample Luau Script
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local Players = game:GetService("Players")

local LocalPlayer = Players.LocalPlayer
print("Loaded script for player: " .. LocalPlayer.Name)

-- Function demonstration
local function upgradeSlot(slotName)
    local args = {
        workspace.Plots.PlayerPlots[tostring(LocalPlayer.UserId)].Floor1.Slots[slotName].Upgrade.Part.UpgradeGUI,
        "NormalUpgrade"
    }
    ReplicatedStorage.Events.UpgradeItemEvent:FireServer(unpack(args))
end

print("Executor workspace ready.")`;

        // Initialize Monaco Editor
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            // Register Luau-like lua language configuration
            editor = monaco.editor.create(document.getElementById('monaco-editor-container'), {
                value: initialLuauCode,
                language: 'lua',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                fontFamily: "'JetBrains Mono', 'Consolas', monospace",
                minimap: { enabled: false },
                roundedSelection: true,
                scrollBeyondLastLine: false
            });

            logToConsole('Monaco Editor loaded with Lua syntax highlighting.', 'info');
        });

        // Console Logging Helper
        function logToConsole(message, type = 'info') {
            const logsContainer = document.getElementById('consoleLogs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerText = `[${timestamp}] ${message}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // Attach Toggle
        document.getElementById('btnAttach').addEventListener('click', () => {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (!isAttached) {
                logToConsole('Injecting client hooks...', 'info');
                setTimeout(() => {
                    isAttached = true;
                    statusDot.classList.add('attached');
                    statusText.innerText = 'Attached (Active)';
                    logToConsole('Successfully attached to target process!', 'success');
                }, 800);
            } else {
                isAttached = false;
                statusDot.classList.remove('attached');
                statusText.innerText = 'Disconnected';
                logToConsole('Detached from process.', 'warn');
            }
        });

        // Execute Action
        document.getElementById('btnExecute').addEventListener('click', () => {
            if (!editor) return;
            const code = editor.getValue();
            if (!code.trim()) {
                logToConsole('Execution failed: Editor is empty.', 'warn');
                return;
            }

            if (!isAttached) {
                logToConsole('Execution warning: Environment not attached. Simulating run...', 'warn');
            }

            logToConsole('Executing Luau script payload...', 'info');
            setTimeout(() => {
                logToConsole('Script executed successfully with 0 errors.', 'success');
            }, 300);
        });

        // Clear Action
        document.getElementById('btnClear').addEventListener('click', () => {
            if (editor) {
                editor.setValue('');
                logToConsole('Editor cleared.', 'info');
            }
        });

        // Clear Console
        document.getElementById('clearConsole').addEventListener('click', () => {
            document.getElementById('consoleLogs').innerHTML = '';
        });

        // Local Storage Script Manager
        function getSavedScripts() {
            return JSON.parse(localStorage.getItem('apex_luau_scripts') || '[]');
        }

        function saveScriptsToStorage(scripts) {
            localStorage.setItem('apex_luau_scripts', JSON.stringify(scripts));
            renderScriptList();
        }

        function renderScriptList() {
            const scriptList = document.getElementById('scriptList');
            scriptList.innerHTML = '';
            const scripts = getSavedScripts();

            if (scripts.length === 0) {
                scriptList.innerHTML = `<div style="font-size:12px; color: var(--text-muted); padding: 8px;">No saved scripts.</div>`;
                return;
            }

            scripts.forEach((script, index) => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.innerHTML = `
                    <span><i class="fa-regular fa-file-code" style="margin-right:6px;"></i>${script.name}</span>
                    <i class="fa-solid fa-trash delete-btn" data-index="${index}"></i>
                `;
                
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    if (editor) {
                        editor.setValue(script.code);
                        logToConsole(`Loaded script: "${script.name}"`, 'info');
                    }
                });

                item.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentScripts = getSavedScripts();
                    currentScripts.splice(index, 1);
                    saveScriptsToStorage(currentScripts);
                    logToConsole(`Deleted script "${script.name}".`, 'warn');
                });

                scriptList.appendChild(item);
            });
        }

        // Save Button Handler
        document.getElementById('btnSave').addEventListener('click', () => {
            if (!editor) return;
            const code = editor.getValue();
            if (!code.trim()) {
                logToConsole('Cannot save empty script.', 'warn');
                return;
            }

            const scriptName = prompt('Enter a name for your script:', `Script_${Date.now().toString().slice(-4)}.luau`);
            if (scriptName) {
                const scripts = getSavedScripts();
                scripts.push({ name: scriptName, code: code });
                saveScriptsToStorage(scripts);
                logToConsole(`Script saved to storage as "${scriptName}".`, 'success');
            }
        });

        // Tab Management
        document.getElementById('addTabBtn').addEventListener('click', () => {
            tabCount++;
            const tabsBar = document.getElementById('tabsBar');
            const addBtn = document.getElementById('addTabBtn');
            
            const newTab = document.createElement('div');
            newTab.className = 'tab';
            newTab.dataset.tab = tabCount;
            newTab.innerHTML = `
                <span>Script ${tabCount}.luau</span>
                <i class="fa-solid fa-xmark close-tab"></i>
            `;

            tabsBar.insertBefore(newTab, addBtn);
            switchTab(newTab);
        });

        document.getElementById('tabsBar').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab');
            if (!tab) return;

            if (e.target.classList.contains('close-tab')) {
                e.stopPropagation();
                if (document.querySelectorAll('.tab').length > 1) {
                    tab.remove();
                    const remainingTabs = document.querySelectorAll('.tab');
                    switchTab(remainingTabs[remainingTabs.length - 1]);
                } else {
                    logToConsole('At least one tab must remain open.', 'warn');
                }
                return;
            }

            switchTab(tab);
        });

        function switchTab(selectedTab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            selectedTab.classList.add('active');
            logToConsole(`Switched to ${selectedTab.querySelector('span').innerText}`, 'info');
        }

        // Initial Render
        renderScriptList();
    </script>
</body>
</html>
