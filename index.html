<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Script Workspace</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #12131a;
            --bg-tertiary: #181a24;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #222431;
            --mac-close: #ff5f56;
            --mac-min: #ffbd2e;
            --mac-max: #27c93f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
        }

        .window {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 900px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 30px var(--accent-glow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- Auth Overlay CSS --- */
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.95);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-title {
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            margin-bottom: 16px;
            outline: none;
            font-size: 14px;
        }
        .auth-input:focus {
            border-color: var(--accent-color);
        }
        
        /* Remember Me Styling */
        .remember-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            user-select: none;
        }
        .remember-container input {
            cursor: pointer;
            accent-color: var(--accent-color);
            width: 15px;
            height: 15px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #4f46e5; }
        .auth-toggle {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .auth-toggle span { color: var(--accent-color); text-decoration: underline; }

        .titlebar {
            height: 46px;
            background: #08090d;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mac-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .mac-close { background-color: var(--mac-close); }
        .mac-min { background-color: var(--mac-min); }
        .mac-max { background-color: var(--mac-max); }

        .titlebar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .titlebar-brand i { color: var(--accent-color); }

        .titlebar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sm {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            background: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-sm:hover {
            background: #222533;
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: #0a0b0e;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header i { 
            color: var(--accent-color);
            cursor: pointer;
        }

        .script-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .script-list::-webkit-scrollbar { width: 4px; }
        .script-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .script-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            color: var(--text-muted);
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .script-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .script-item .delete-btn {
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
            cursor: pointer;
        }

        .script-item:hover .delete-btn { opacity: 1; }
        .script-item .delete-btn:hover { color: var(--mac-close); }

        .user-panel {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: #07080b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }
        .user-info { display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .logout-btn { color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
        .logout-btn:hover { color: var(--mac-close); }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
        }

        .tabs-bar {
            height: 38px;
            background: #08090d;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            color: var(--text-muted);
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border-color: var(--accent-color);
            box-shadow: inset 0 2px 0 var(--accent-color);
        }

        .tab .close-tab {
            font-size: 10px;
            border-radius: 50%;
            padding: 2px;
            cursor: pointer;
        }
        .tab .close-tab:hover { color: var(--mac-close); }

        .add-tab-btn {
            padding: 6px 10px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .add-tab-btn:hover { color: var(--text-main); }

        #monaco-editor-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .context-menu {
            position: fixed;
            z-index: 10000;
            width: 160px;
            background: #14161f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 5px;
            display: none;
            flex-direction: column;
            gap: 2px;
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .context-menu-item:hover { background: var(--accent-color); color: #ffffff; }
        .context-menu-item i { font-size: 11px; width: 14px; }
    </style>
</head>
<body>

    <div class="window">
        <!-- Auth Screen Overlay -->
        <div class="auth-overlay" id="authOverlay">
            <div class="auth-card">
                <div class="auth-title" id="authTitle">Sign In</div>
                <div class="auth-subtitle" id="authSubtitle">Access your isolated Luau workspace cloud profile</div>
                <input type="text" class="auth-input" id="authUsername" placeholder="Username">
                <input type="password" class="auth-input" id="authPassword" placeholder="Password">
                
                <!-- Added Remember Login Elements -->
                <label class="remember-container">
                    <input type="checkbox" id="authRememberMe">
                    <span>Remember my profile</span>
                </label>

                <button class="auth-btn" id="authSubmitBtn">Login</button>
                <div class="auth-toggle" id="authToggle">Don't have an account? <span>Register</span></div>
            </div>
        </div>

        <div class="titlebar">
            <div class="titlebar-left">
                <div class="mac-controls">
                    <span class="mac-btn mac-close"></span>
                    <span class="mac-btn mac-min"></span>
                    <span class="mac-btn mac-max"></span>
                </div>
                <div class="titlebar-brand">
                    <i class="fa-solid fa-terminal"></i>
                    <span>Luau Dev Environment</span>
                </div>
            </div>
            
            <div class="titlebar-actions">
                <button class="btn-sm" id="btnCopy"><i class="fa-solid fa-copy"></i> Copy</button>
                <button class="btn-sm" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                <button class="btn-sm" id="btnClear"><i class="fa-solid fa-eraser"></i> Clear</button>
            </div>
        </div>

        <div class="workspace">
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>Saved Explorer</span>
                    <i class="fa-solid fa-square-plus" id="sidebarAddBtn" title="New file"></i>
                </div>
                <div class="script-list" id="scriptList"></div>
                
                <div class="user-panel">
                    <div class="user-info">
                        <i class="fa-solid fa-user-astronaut" style="color:var(--accent-color)"></i>
                        <span id="displayUsername">Guest</span>
                    </div>
                    <i class="fa-solid fa-right-from-bracket logout-btn" id="logoutBtn" title="Logout"></i>
                </div>
            </div>

            <div class="editor-container">
                <div class="tabs-bar" id="tabsBar">
                    <div class="add-tab-btn" id="addTabBtn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div id="monaco-editor-container"></div>
            </div>
        </div>
    </div>

    <div class="context-menu" id="customContextMenu">
        <div class="context-menu-item" id="ctxRename"><i class="fa-solid fa-pen"></i> Rename</div>
        <div class="context-menu-item" id="ctxClose"><i class="fa-solid fa-xmark"></i> Close Tab</div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        const defaultCode = `-- Luau Cloud Environment\nlocal Players = game:GetService("Players")\nprint("Welcome back, ", Players.LocalPlayer)`;

        let editor = null;
        let activeTabId = null;
        let contextTargetTabId = null;
        let tabs = []; 
        let currentUser = null;
        let isSignUpMode = false;

        // --- AUTH SYSTEM LOGIC ---
        function getAccounts() {
            return JSON.parse(localStorage.getItem('workspace_accounts') || '{}');
        }

        function checkPersistentSession() {
            const savedSessionUser = localStorage.getItem('workspace_active_session');
            if (savedSessionUser) {
                const db = getAccounts();
                if (db[savedSessionUser]) {
                    currentUser = savedSessionUser;
                    document.getElementById('displayUsername').innerText = currentUser;
                    document.getElementById('authOverlay').style.display = 'none';
                    return true;
                }
            }
            return false;
        }

        function handleAuth() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const rememberMe = document.getElementById('authRememberMe').checked;
            
            if(!user || !pass) return alert("Fill in the fields profile boss.");

            const db = getAccounts();

            if (isSignUpMode) {
                if (db[user]) return alert("Username taken highkey.");
                db[user] = { password: pass, scripts: [], tabsState: [] };
                localStorage.setItem('workspace_accounts', JSON.stringify(db));
                alert("Account secured! Logging in...");
            } else {
                if (!db[user] || db[user].password !== pass) return alert("Wrong credentials bestie 💀");
            }

            currentUser = user;
            
            if (rememberMe) {
                localStorage.setItem('workspace_active_session', currentUser);
            } else {
                localStorage.removeItem('workspace_active_session');
            }

            document.getElementById('displayUsername').innerText = currentUser;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';

            initializeWorkspace();
        }

        document.getElementById('authSubmitBtn').addEventListener('click', handleAuth);
        document.getElementById('authToggle').addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Register" : "Login";
            document.getElementById('authToggle').innerHTML = isSignUpMode ? "Got an account? <span>Sign In</span>" : "Don't have an account? <span>Register</span>";
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            saveUserDataToCloud();
            localStorage.removeItem('workspace_active_session'); // Wipe auto-login token
            tabs.forEach(t => t.model && t.model.dispose());
            tabs = [];
            currentUser = null;
            document.getElementById('authRememberMe').checked = false;
            document.getElementById('authOverlay').style.display = 'flex';
        });

        // --- ACCOUNT DATABASE SAVE/LOAD SYNCING ---
        function saveUserDataToCloud() {
            if (!currentUser) return;
            const db = getAccounts();
            if (!db[currentUser]) return;

            db[currentUser].tabsState = tabs.map(t => ({
                id: t.id,
                name: t.name,
                code: t.model ? t.model.getValue() : t.code
            }));
            localStorage.setItem('workspace_accounts', JSON.stringify(db));
        }

        function initializeWorkspace() {
            const db = getAccounts();
            const userData = db[currentUser];
            
            let loadedTabs = userData.tabsState || [];
            if (loadedTabs.length === 0) {
                loadedTabs = [{ id: 'tab_init', name: 'Script 1.luau', code: defaultCode }];
            }

            tabs = loadedTabs.map(t => ({
                id: t.id,
                name: t.name,
                model: monaco.editor.createModel(t.code, 'lua')
            }));

            activeTabId = tabs[0].id;
            renderTabs();
            editor.setModel(tabs[0].model);
            renderScriptList();
        }

        // --- CORE MONACO INIT ---
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('monaco-editor-container'), {
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
                minimap: { enabled: true },
                padding: { top: 12, bottom: 12 }
            });

            // Check if user has an existing saved login token right after Monaco wakes up
            if (checkPersistentSession()) {
                initializeWorkspace();
            }
        });

        function renderTabs() {
            const tabsBar = document.getElementById('tabsBar');
            const addBtn = document.getElementById('addTabBtn');
            document.querySelectorAll('.tab').forEach(t => t.remove());

            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabEl.dataset.id = tab.id;
                tabEl.innerHTML = `<span>${tab.name}</span><i class="fa-solid fa-xmark close-tab"></i>`;

                tabEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    contextTargetTabId = tab.id;
                    showContextMenu(e.clientX, e.clientY);
                });
                tabsBar.insertBefore(tabEl, addBtn);
            });
        }

        function switchTab(tabId) {
            if (activeTabId === tabId) return;
            activeTabId = tabId;
            renderTabs();
            
            const targetTab = tabs.find(t => t.id === tabId);
            if (targetTab && editor) {
                editor.setModel(targetTab.model);
            }
            saveUserDataToCloud();
        }

        function createNewTab(name = `Script ${tabs.length + 1}.luau`, code = '-- New Luau Script\n') {
            const newModel = monaco.editor.createModel(code, 'lua');
            const newTab = { id: `tab_${Date.now()}_${Math.random().toString(36).substr(2,5)}`, name, model: newModel };
            tabs.push(newTab);
            switchTab(newTab.id);
        }

        document.getElementById('addTabBtn').addEventListener('click', () => createNewTab());
        document.getElementById('sidebarAddBtn').addEventListener('click', () => createNewTab());

        document.getElementById('tabsBar').addEventListener('click', (e) => {
            const tabEl = e.target.closest('.tab');
            if (!tabEl) return;
            const tabId = tabEl.dataset.id;

            if (e.target.classList.contains('close-tab')) {
                e.stopPropagation();
                closeTab(tabId);
                return;
            }
            switchTab(tabId);
        });

        function closeTab(tabId) {
            if (tabs.length <= 1) return;
            const idx = tabs.findIndex(t => t.id === tabId);
            if (idx === -1) return;

            tabs[idx].model.dispose();
            tabs.splice(idx, 1);
            
            if (activeTabId === tabId) {
                const nextTab = tabs[Math.max(0, idx - 1)];
                activeTabId = nextTab.id;
                editor.setModel(nextTab.model);
            }
            saveUserDataToCloud();
            renderTabs();
        }

        // --- SAVED FILES EXPLORER LOGIC ---
        function renderScriptList() {
            const list = document.getElementById('scriptList');
            list.innerHTML = '';
            if (!currentUser) return;

            const db = getAccounts();
            const scripts = db[currentUser].scripts || [];

            if (scripts.length === 0) {
                list.innerHTML = `<div style="font-size:11px; color: var(--text-muted); padding: 8px;">Workspace is empty.</div>`;
                return;
            }

            scripts.forEach((script, index) => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.innerHTML = `
                    <span><i class="fa-regular fa-file-code" style="margin-right:6px; color: var(--accent-color);"></i>${script.name}</span>
                    <i class="fa-solid fa-xmark delete-btn"></i>
                `;
                
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    const existingTab = tabs.find(t => t.name === script.name);
                    if (existingTab) {
                        switchTab(existingTab.id);
                    } else {
                        createNewTab(script.name, script.code);
                    }
                });

                item.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentDb = getAccounts();
                    currentDb[currentUser].scripts.splice(index, 1);
                    localStorage.setItem('workspace_accounts', JSON.stringify(currentDb));
                    renderScriptList();
                });

                list.appendChild(item);
            });
        }

        document.getElementById('btnSave').addEventListener('click', () => {
            if (!editor || !currentUser) return;
            const activeTab = tabs.find(t => t.id === activeTabId);
            const defaultName = activeTab ? activeTab.name : 'script.luau';

            const name = prompt('Save script to account as:', defaultName);
            if (name?.trim()) {
                const cleanName = name.trim();
                const currentDb = getAccounts();
                const codeContent = editor.getValue();
                
                let userScripts = currentDb[currentUser].scripts || [];
                const existIdx = userScripts.findIndex(s => s.name === cleanName);
                
                if (existIdx > -1) userScripts[existIdx].code = codeContent;
                else userScripts.push({ name: cleanName, code: codeContent });
                
                currentDb[currentUser].scripts = userScripts;
                localStorage.setItem('workspace_accounts', JSON.stringify(currentDb));
                
                if (activeTab) {
                    activeTab.name = cleanName;
                    renderTabs();
                }
                renderScriptList();
                saveUserDataToCloud();
            }
        });

        // --- GLOBAL INTERFACE UTILITIES ---
        const menu = document.getElementById('customContextMenu');
        function showContextMenu(x, y) {
            menu.style.left = `${x}px`; menu.style.top = `${y}px`; menu.style.display = 'flex';
        }
        function hideContextMenu() { menu.style.display = 'none'; }
        document.addEventListener('click', hideContextMenu);

        document.getElementById('ctxRename').addEventListener('click', () => {
            if (!contextTargetTabId) return;
            const tab = tabs.find(t => t.id === contextTargetTabId);
            if (tab) {
                const newName = prompt('Enter new tab name:', tab.name);
                if (newName?.trim()) {
                    tab.name = newName.trim();
                    renderTabs();
                    saveUserDataToCloud();
                }
            }
        });

        document.getElementById('ctxClose').addEventListener('click', () => {
            if (contextTargetTabId) closeTab(contextTargetTabId);
        });

        document.getElementById('btnCopy').addEventListener('click', async () => {
            if (!editor) return;
            try {
                await navigator.clipboard.writeText(editor.getValue());
                const btn = document.getElementById('btnCopy');
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                setTimeout(() => { btn.innerHTML = `<i class="fa-solid fa-copy"></i> Copy`; }, 1200);
            } catch (err) { console.error(err); }
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if (editor) editor.setValue('');
        });

        window.addEventListener('beforeunload', saveUserDataToCloud);
    </script>
</body>
</html>
